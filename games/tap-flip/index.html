<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#070a0f">
  <script>
  /* iPhone Safari ignores user-scalable=no: block pinch, double-tap zoom and page scroll directly.
     The game reads pointer events, so play is unaffected; links/buttons keep their normal taps. */
  (function(){
    var ok=function(t){ return t&&t.closest&&t.closest('a,button,input,select,textarea,label'); };
    ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); },{passive:false}); });
    document.addEventListener('touchstart',function(e){ if(e.touches.length>1||!ok(e.target))e.preventDefault(); },{passive:false});
    document.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
    var last=0; document.addEventListener('touchend',function(e){ var n=Date.now(); if(n-last<350&&!ok(e.target))e.preventDefault(); last=n; },{passive:false});
    document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});
  })();
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔄</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden; background: #070a0f;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    #game {
      position: fixed; left: 0; top: 0; display: block;
      width: 100vw; height: 100vh; height: 100dvh; touch-action: none;
    }
    .home-btn {
      position: fixed; z-index: 10;
      top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left));
      display: flex; align-items: center; min-height: 36px;
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      color: #7d8da0; text-decoration: none;
      background: rgba(7,10,15,0.7); border: 1px solid #1d2a3a;
      padding: 0 10px; touch-action: manipulation;
    }
    /* invisible padding so the tap target is ~44px without changing the look */
    .home-btn::before { content: ''; position: absolute; inset: -4px; }
    .home-btn:hover, .home-btn:focus-visible { color: #41ff6b; border-color: #41ff6b; outline: none; }
    /* mid-run the whole screen is the flip button: keep a stray thumb off the home link */
    body.playing .home-btn { display: none; }
  </style>
</head>
<body>
  <a class="home-btn" href="../../">◂ OUTPOST BOYZ</a>
  <canvas id="game"></canvas>
  <script>
  (function () {
    'use strict';
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const PIXEL = "'Press Start 2P', monospace";
    const SLUG = 'tap-flip';
    const BEST_KEY = 'ob-tapflip-best', SEEN_KEY = 'ob-tapflip-seen';
    const MAX_STEP = 1 / 120;     // physics substep cap -> same feel at 60/90/120/144Hz
    const MAX_FRAME = 0.1;        // never simulate more than this per frame (tab resume, hitches)
    const FLIP_BUFFER = 0.1;      // a tap just before landing still flips on touchdown
    const RETRY_LOCK = 0.45;      // ignore taps right after dying (no accidental instant retry)
    const FAIR_MARGIN = 1 / 60;   // safety margin for the solvability guard (seconds)

    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { } }

    const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);

    // Geometry (cached on resize instead of recomputed every call)
    let W = 0, H = 0, dpr = 1, band = 26, size = 22;
    let scanPattern = null;

    const state = {
      mode: 'menu',           // menu | play | dead
      paused: false,
      score: 0,
      final: 0,
      best: Math.max(0, Math.floor(+(lsGet(BEST_KEY) || 0)) || 0),
      seen: lsGet(SEEN_KEY) === '1',
      speed: 0,
      player: { y: 0, vy: 0, grav: 1, grounded: true },
      obstacles: [],
      pending: null,
      spawnIn: 0,
      buffer: 0,
      runT: 0,
      deadAt: 0,
      submitted: false,
      gridX: 0,
      fair: { side: true, lo: 0, land: 0 },
      t: 0
    };

    const floorY = () => H - band - size;
    const ceilY = () => band;
    const baseSpeed = () => Math.max(260, W * 0.32);
    const accel = () => W * 0.012;

    function buildScanlines() {
      // device-pixel pattern so the scanlines stay crisp on high-DPI screens
      const ph = Math.max(2, Math.round(3 * dpr));
      const c = document.createElement('canvas');
      c.width = 1; c.height = ph;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(0,0,0,0.10)';
      g.fillRect(0, 0, 1, Math.max(1, Math.round(dpr)));
      scanPattern = ctx.createPattern(c, 'repeat');
    }

    function resize() {
      const oldW = W, oldH = H;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(1, canvas.clientWidth || window.innerWidth);
      H = Math.max(1, canvas.clientHeight || window.innerHeight);
      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      band = Math.max(26, H * 0.06);
      size = Math.max(22, Math.min(W, H) * 0.045);
      buildScanlines();

      // keep the player on its surface / inside the track after the size changes
      const p = state.player;
      if (oldH && state.mode !== 'menu') {
        if (p.grounded) p.y = p.grav === 1 ? floorY() : ceilY();
        else p.y = Math.min(floorY(), Math.max(ceilY(), p.y * (H / oldH)));
      }
      // rotation / window width change mid-run: pause instead of killing the player
      if (oldW && Math.abs(W - oldW) > 1 && state.mode === 'play') state.paused = true;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
    resize();

    function reset() {
      const p = state.player;
      state.score = 0;
      state.final = 0;
      state.speed = baseSpeed();
      p.grav = 1;
      p.grounded = true;
      p.y = floorY();
      p.vy = 0;
      state.obstacles.length = 0;
      state.pending = null;
      state.spawnIn = 0.9;
      state.buffer = 0;
      state.runT = 0;
      state.paused = false;
      state.submitted = false;
      // solvability tracker: virtual ceiling group, player grounded on the floor at t=0
      state.fair.side = true; state.fair.lo = 0; state.fair.land = 0;
    }

    function start() { reset(); state.mode = 'play'; }

    function tryFlip() {
      const p = state.player;
      if (state.buffer > 0 && p.grounded) {
        p.grav *= -1; p.vy = 0; p.grounded = false; state.buffer = 0;
      }
    }

    function press() {
      if (state.paused) { state.paused = false; return; }
      if (state.mode === 'menu') { start(); return; }
      if (state.mode === 'dead') { if (state.t - state.deadAt >= RETRY_LOCK) start(); return; }
      // only flips when grounded on floor or ceiling (buffered briefly if airborne)
      state.buffer = FLIP_BUFFER;
      tryFlip();
    }

    canvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      press();
    });
    // stops iOS double-tap zoom, long-press callout and emulated mouse events
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) {
      const k = e.code;
      if (k === 'Space' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'Enter') {
        if (k === 'Enter' && e.target && e.target.closest && e.target.closest('a,button')) return;
        e.preventDefault();
        if (e.repeat) return;
        press();
      } else if ((k === 'KeyP' || k === 'Escape') && state.mode === 'play') {
        state.paused = !state.paused;
      }
    });

    function pauseRun() { if (state.mode === 'play') state.paused = true; }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) pauseRun();
      last = performance.now();
    });
    window.addEventListener('blur', pauseRun);
    window.addEventListener('pagehide', pauseRun);

    // --- Solvability guard -------------------------------------------------
    // Every obstacle needs the player on the opposite surface while it passes.
    // A side change forces a flip whose earliest time is bounded by (a) landing
    // from the previous flip and (b) clearing the previous group's blocks; the
    // new block must still be dodgeable after that. If not, it spawns a bit
    // later. Only impossible patterns are touched; everything else is as before.
    function travelTime(d) {
      if (d <= 0) return 0;
      const v = state.speed, a = accel();
      return a > 0 ? (-v + Math.sqrt(v * v + 2 * a * d)) / a : d / v;
    }
    function fairWait(o) {
      const f = state.fair, px = W * 0.22;
      const G = H * 4.6, D = Math.max(1, floorY() - ceilY());
      const ts = state.runT + travelTime(o.x - (px + size));
      const te = state.runT + travelTime(o.x + o.w - px);
      const lo = te - Math.sqrt(2 * Math.max(0, D - o.h) / G) + FAIR_MARGIN;
      if (o.top === f.side) { f.lo = Math.max(f.lo, lo); return 0; }
      const e = Math.max(f.lo, f.land);
      const hi = ts - Math.sqrt(2 * Math.min(o.h, D) / G) - FAIR_MARGIN;
      if (e > hi) return e - hi + 0.005;
      f.side = o.top; f.land = e + Math.sqrt(2 * D / G) + FAIR_MARGIN; f.lo = lo;
      return 0;
    }

    function spawn() {
      let o = state.pending;
      if (!o) {
        const onTop = Math.random() < 0.5;
        const h = size * (1 + Math.random() * 1.6);
        const w = size * (0.7 + Math.random() * 0.9);
        o = { x: 0, w, h, top: onTop, color: onTop ? '#ff4d9d' : '#ffb454' };
      }
      o.x = W + o.w;
      const wait = fairWait(o);
      if (wait > 0) { state.pending = o; state.spawnIn = wait; return; }
      state.pending = null;
      state.obstacles.push(o);
      // gap shrinks as speed grows
      const gap = (size * 7) / (state.speed / baseSpeed());
      state.spawnIn = (gap / state.speed) * (0.85 + Math.random() * 0.5);
    }

    function die() {
      state.mode = 'dead';
      state.deadAt = state.t;
      state.final = Math.floor(state.score);
      if (state.final > state.best) { state.best = state.final; lsSet(BEST_KEY, state.best); }
      if (!state.seen) { state.seen = true; lsSet(SEEN_KEY, '1'); }
      if (!state.submitted) {
        state.submitted = true;
        const ob = window.OB;
        if (ob) {
          try { const r = ob.submitScore(SLUG, state.final); if (r && r.catch) r.catch(function () { }); } catch (e) { }
          try { const r = ob.gameOver(SLUG); if (r && r.catch) r.catch(function () { }); } catch (e) { }
        }
      }
    }

    function update(dt) {
      const p = state.player;
      const G = H * 4.6;
      state.runT += dt;

      state.speed += dt * accel();
      state.score += dt * state.speed * 0.045;

      if (state.buffer > 0) { tryFlip(); state.buffer -= dt; }

      p.vy += G * p.grav * dt;
      p.y += p.vy * dt;

      const fy = floorY(), cy = ceilY();
      if (p.grav === 1 && p.y >= fy) { p.y = fy; p.vy = 0; p.grounded = true; }
      if (p.grav === -1 && p.y <= cy) { p.y = cy; p.vy = 0; p.grounded = true; }
      if (p.grounded && state.buffer > 0) tryFlip();

      state.spawnIn -= dt;
      if (state.spawnIn <= 0) spawn();

      // move + cull in place (no per-frame array allocation)
      const obs = state.obstacles;
      let n = 0;
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i];
        o.x -= state.speed * dt;
        if (o.x + o.w > -10) obs[n++] = o;
      }
      obs.length = n;

      const px = W * 0.22, ps = size;
      for (let i = 0; i < n; i++) {
        const o = obs[i];
        const oy = o.top ? band : H - band - o.h;
        if (px < o.x + o.w && px + ps > o.x && p.y < oy + o.h && p.y + ps > oy) { die(); return; }
      }
    }

    function drawBands() {
      ctx.fillStyle = '#101823';
      ctx.fillRect(0, 0, W, band);
      ctx.fillRect(0, H - band, W, band);
      ctx.fillStyle = '#41ff6b';
      ctx.fillRect(0, band - 3, W, 3);
      ctx.fillRect(0, H - band, W, 3);
    }

    function text(str, sz, y, color, glow) {
      // Press Start 2P glyphs are 1em wide: shrink long lines to fit narrow phones
      const maxW = W - 24;
      if (str.length * sz > maxW) sz = Math.max(6, maxW / str.length);
      ctx.font = sz + 'px ' + PIXEL;
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.shadowColor = glow || color;
      ctx.shadowBlur = glow ? 16 : 0;
      ctx.fillText(str, W / 2, y);
      ctx.shadowBlur = 0;
    }

    function draw() {
      ctx.fillStyle = '#070a0f';
      ctx.fillRect(0, 0, W, H);

      // grid backdrop (one path, one stroke)
      ctx.strokeStyle = 'rgba(65,255,107,0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = -state.gridX; x < W; x += 44) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      ctx.stroke();

      drawBands();

      const ps = size, px = W * 0.22;
      const blink = Math.floor(state.t * 1.6) % 2 === 0;
      const small = Math.max(9, Math.min(13, W * 0.02));
      const mid = Math.max(10, Math.min(16, W * 0.025));

      if (state.mode === 'play' || state.mode === 'dead') {
        const obs = state.obstacles;
        for (let i = 0; i < obs.length; i++) {
          const o = obs[i];
          const oy = o.top ? band : H - band - o.h;
          ctx.fillStyle = o.color;
          ctx.shadowColor = o.color; ctx.shadowBlur = 12;
          ctx.fillRect(o.x, oy, o.w, o.h);
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = '#41ff6b';
        ctx.shadowColor = '#41ff6b'; ctx.shadowBlur = 18;
        ctx.fillRect(px, state.player.y, ps, ps);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#04140a';
        const eye = ps * 0.18;
        ctx.fillRect(px + ps * 0.58, state.player.y + (state.player.grav === 1 ? ps * 0.2 : ps * 0.62), eye, eye);

        text('SCORE ' + (state.mode === 'dead' ? state.final : Math.floor(state.score)), Math.max(11, W * 0.016), band + 34, '#d7e2ee');

        // first-run coaching for the opening seconds
        if (state.mode === 'play' && !state.seen && state.runT < 3.5 && !state.paused) {
          text(isTouch ? 'TAP ANYWHERE TO FLIP' : 'SPACE TO FLIP', mid, H * 0.5, '#ffb454', '#ffb454');
        }
      }

      if (state.mode === 'menu') {
        text('TAP FLIP', Math.min(42, W * 0.08), H * 0.4, '#41ff6b', '#41ff6b');
        text(isTouch ? 'TAP TO FLIP GRAVITY' : 'SPACE OR CLICK TO FLIP GRAVITY', small, H * 0.5, '#7d8da0');
        text('SWAP FLOOR / CEILING - DODGE THE BLOCKS', Math.max(8, small * 0.85), H * 0.56, '#7d8da0');
        if (blink)
          text(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', mid, H * 0.65, '#ffb454', '#ffb454');
        if (state.best > 0)
          text('BEST ' + state.best, Math.max(9, Math.min(12, W * 0.018)), H * 0.73, '#4dd8ff');
      }

      if (state.mode === 'dead') {
        ctx.fillStyle = 'rgba(7,10,15,0.72)';
        ctx.fillRect(0, 0, W, H);
        text('WRECKED', Math.min(38, W * 0.07), H * 0.38, '#ff4d9d', '#ff4d9d');
        text('SCORE ' + state.final + '   BEST ' + state.best, Math.max(10, Math.min(14, W * 0.022)), H * 0.5, '#d7e2ee');
        if (blink && state.t - state.deadAt >= RETRY_LOCK)
          text(isTouch ? 'TAP TO RETRY' : 'SPACE TO RETRY', mid, H * 0.6, '#41ff6b', '#41ff6b');
      }

      if (state.mode === 'play' && state.paused) {
        ctx.fillStyle = 'rgba(7,10,15,0.72)';
        ctx.fillRect(0, 0, W, H);
        text('PAUSED', Math.min(38, W * 0.07), H * 0.42, '#4dd8ff', '#4dd8ff');
        if (blink) text(isTouch ? 'TAP TO RESUME' : 'PRESS SPACE TO RESUME', mid, H * 0.54, '#41ff6b', '#41ff6b');
      }

      // scanlines (pre-rendered device-pixel pattern, one fill)
      if (scanPattern) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = scanPattern;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    }

    let last = performance.now();
    let homeHidden = false;
    function loop(now) {
      let dt = (now - last) / 1000;
      last = now;
      if (!(dt > 0)) dt = 0;
      if (dt > MAX_FRAME) dt = MAX_FRAME;
      state.t += dt;

      const running = state.mode === 'play' && !state.paused;
      if (running) {
        // split the frame into equal substeps <= 1/120s: identical speed on any refresh rate
        const steps = Math.ceil(dt / MAX_STEP - 1e-6);
        const h = steps > 0 ? dt / steps : 0;
        for (let i = 0; i < steps && state.mode === 'play'; i++) update(h);
      }
      if (running !== homeHidden) { homeHidden = running; document.body.classList.toggle('playing', running); }
      const scroll = running ? state.speed : (state.mode === 'play' ? 0 : 40);
      state.gridX = (state.gridX + dt * scroll * 0.35) % 44;

      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
