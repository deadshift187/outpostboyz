<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<script>
/* iPhone Safari ignores user-scalable=no: block pinch (two thumbs on stick + button read as a pinch),
   double-tap zoom and page scroll directly. Touch controls use pointer events, so they are unaffected;
   links/buttons/inputs keep their normal taps. */
(function(){
  var ok=function(t){ return t&&t.closest&&t.closest('a,button,input,select,textarea,label'); };
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); },{passive:false}); });
  document.addEventListener('touchstart',function(e){ if(e.touches.length>1||!ok(e.target))e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
  var last=0; document.addEventListener('touchend',function(e){ var n=Date.now(); if(n-last<350&&!ok(e.target))e.preventDefault(); last=n; },{passive:false});
  document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});
})();
</script>
<meta name="theme-color" content="#070a0f"/>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SCRAP RUN">
<title>SCRAP RUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;height:100dvh;background:#070a0f;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
  body.kb{cursor:none}
  #wrap{position:fixed;left:0;right:0;top:0;height:100dvh;display:flex;align-items:center;justify-content:center}
  body.touch.portrait #wrap{height:58dvh;align-items:flex-end}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  .home-btn{position:fixed;top:10px;left:10px;z-index:10;font-family:'Press Start 2P',monospace;font-size:8px;color:#7d8da0;text-decoration:none;background:rgba(7,10,15,.7);border:1px solid #1d2a3a;padding:8px 10px}
  body.playing .home-btn{display:none}
  /* ---- touch controls (shown after the first touch) ---- */
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5;font-family:'Press Start 2P',monospace}
  body.touch #touch{display:block}
  #tpad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);pointer-events:auto;touch-action:none}
  #tpad .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,180,84,.35);border:2px solid rgba(255,180,84,.7)}
  #tpad .ar{position:absolute;color:rgba(255,255,255,.35);font-size:10px}
  .tb{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9px;text-shadow:1px 1px 0 #000;border:2px solid rgba(255,255,255,.35)}
  .tb.on{filter:brightness(1.6);transform:scale(.94)}
  #tbFire{right:max(96px,calc(env(safe-area-inset-right) + 82px));bottom:max(22px,env(safe-area-inset-bottom));width:74px;height:74px;background:rgba(255,77,157,.45)}
  #tbJump{right:max(14px,env(safe-area-inset-right));bottom:max(74px,calc(env(safe-area-inset-bottom) + 60px));width:74px;height:74px;background:rgba(65,255,107,.40)}
  #tbBomb{right:max(24px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:48px;height:48px;background:rgba(255,180,84,.45);font-size:7px}
  #tbPause{right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:36px;height:36px;border-radius:8px;background:rgba(7,10,15,.6);font-size:9px}
  body.touch.landscape #tpad{opacity:.8} body.touch.landscape .tb{opacity:.85}
</style>
</head>
<body>
<a class="home-btn" href="../../">◂ OUTPOST BOYZ</a>
<div id="wrap"><canvas id="c" width="256" height="144"></canvas></div>
<div id="touch">
  <div id="tpad"><div class="knob"></div><span class="ar" style="left:62px;top:6px">▲</span><span class="ar" style="left:62px;bottom:6px">▼</span><span class="ar" style="left:8px;top:62px">◀</span><span class="ar" style="right:8px;top:62px">▶</span></div>
  <div class="tb" id="tbFire">SHOOT</div><div class="tb" id="tbJump">JUMP</div><div class="tb" id="tbBomb">BOMB</div><div class="tb" id="tbPause">II</div>
</div>
<!-- load order matters: shared core -> data -> rules -> presentation -> glue -->
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/bosses.js"></script>
<script src="js/sim.js"></script>
<script src="js/bot.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/bossgfx.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
<!-- Outpost Boyz SDK: scores + play tracking (optional; game runs fine offline without it) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="../../assets/ob-sdk.js"></script>
</body>
</html>
