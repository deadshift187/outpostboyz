<!-- The game code is a straight copy of the live-games web edition in /games/live/ (see /games/live/climb/).
     <base> makes every relative path inside it (./gifts.json, ../shared/, ../game/, ../tutorials/) resolve there. -->
<base href="/games/live/climb/">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>
/* iPhone Safari ignores user-scalable=no: block pinch, double-tap zoom and page scroll / pull-to-refresh during play.
   The on-screen pad and buttons use pointer events, so they are unaffected. The settings menu and the
   YOU ARE THE CHAT tray still scroll with one finger; links, buttons and form fields keep their normal taps. */
(function(){
  var ok=function(t){ return t&&t.closest&&t.closest('a,button,input,select,textarea,label'); };
  var scroller=function(t){ return t&&t.closest&&t.closest('#shell .menu,#shell .tray,#shell .handoff'); };
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); },{passive:false}); });
  document.addEventListener('touchstart',function(e){ if(e.touches.length>1||!(ok(e.target)||scroller(e.target)))e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove',function(e){ if(e.touches.length>1||!scroller(e.target))e.preventDefault(); },{passive:false});
  var last=0; document.addEventListener('touchend',function(e){ var n=Date.now(); if(n-last<350&&!ok(e.target))e.preventDefault(); last=n; },{passive:false});
  document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});
})();
</script>

<body>
<canvas id="stage" width="1080" height="1920" tabindex="-1" aria-label="STACKED game"></canvas>
<script type="module">
import { boot } from '../shared/shell.js';
const SLUG = 'stacked';
const TITLE = document.title;
boot('climb').then(site).catch((e) => {
  console.error(e);
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;inset:auto 16px 16px;color:#ff4d6d;background:#111;padding:12px;border-radius:8px;white-space:pre-wrap;font:13px monospace';
  d.textContent = 'This game failed to start: ' + (e && e.message || e);
  document.body.appendChild(d);
});

// Outpost Boyz site hooks: home link, tab title, scores. The game never depends on any of it.
function site(shell) {
  document.title = TITLE;
  // the menu's "ALL GAMES" link is the home link: only visible while the menu is up, so it never covers play
  const a = shell.ui && shell.ui.menu.querySelector('a.all');
  if (a) { a.href = '/'; a.textContent = '◂ OUTPOST BOYZ'; a.classList.add('ob-home'); }
  // a run ends at the summit (BIRD-9's rope at 250 m); the next run starts after the cinematic.
  // Score = the old CLIMB OR DIE rule: 250 m + every second under 7:00. Reported once per run.
  let reported = null;
  setInterval(() => {
    try {
      const S = window.__platform && window.__platform.game.dev.S;
      if (!S || !S.cine || !S.run || reported === S.run) return;
      reported = S.run;
      const score = 250 + Math.max(0, 420 - Math.round(S.cine.runSec || 0));
      if (window.OB) {
        const p = OB.submitScore(SLUG, score); if (p && p.catch) p.catch(() => {});
        const q = OB.gameOver(SLUG); if (q && q.catch) q.catch(() => {});
      }
    } catch (e) { /* offline / blocked: the game never depends on it */ }
  }, 250);
}
</script>
<!-- Outpost Boyz SDK: scores + play tracking (optional; the game runs fine offline without it) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
