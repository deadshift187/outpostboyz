<script>
/* iPhone Safari ignores user-scalable=no: a stray pinch (thumbs on stick + button) or double-tap zoomed the
   game in mid-level (Saint, 9/29). Block pinch, double-tap zoom and scroll; the touch pad uses pointer events. */
(function(){
  var ok=function(t){ return t&&t.closest&&t.closest('a,button,input,select,textarea,label'); };
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); },{passive:false}); });
  document.addEventListener('touchstart',function(e){ if(e.touches.length>1||!ok(e.target))e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
  var last=0; document.addEventListener('touchend',function(e){ var n=Date.now(); if(n-last<350&&!ok(e.target))e.preventDefault(); last=n; },{passive:false});
  document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});
})();
</script>

<script>
(function () {
  'use strict';
  var SLUG = 'save-lost-angeles', PRICE = '$4.99';
  var HERE = '/games/' + SLUG + '/';
  var gate = document.getElementById('obGate');
  var purchased = /[?&]purchased=1/.test(location.search);
  var booted = false;

  // The game shell (head) blocks page scrolling/zoom touches at the document for gameplay. Keep touches inside
  // the gate from reaching those handlers so the sell page scrolls, the screenshot strip swipes and the
  // trailer's controls work. The gate is hidden once the game runs, so gameplay is untouched.
  ['touchstart', 'touchmove', 'touchend'].forEach(function (n) {
    gate.addEventListener(n, function (e) { e.stopPropagation(); }, { passive: true });
  });

  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function card(html) {
    gate.className = ''; gate.innerHTML = '<div class="c">' + html + '</div>'; gate.style.display = 'flex';
  }
  var TOP = '<div class="k">Outpost Boyz &middot; Out now</div><h1>SAVE LOST ANGELES</h1>' +
    '<p class="t">Golden Boy vs. the system. Run all of LA.</p>' +
    '<ul class="f"><li>28 levels</li><li>5 worlds</li><li>20 bosses</li><li>3 heroes</li><li>2-player co-op</li><li>Phone + computer</li></ul>';
  var LEGAL = '<p class="lg">One-time purchase &middot; <a href="/terms/">Terms</a> &middot; <a href="/refunds/">Refunds</a> ' +
    '(14-day unplayable guarantee) &middot; <a href="/privacy/">Privacy</a></p>';
  var SHOTS = [
    ['boss-basura', 'Boss fight: Mayor Basura, Long Beach'],
    ['flood', 'Water main burst: ride it out'],
    ['heroes', '3 heroes, 3 different perks'],
    ['paparazzi', 'Paparazzi swarm, Playa Vista'],
    ['golden-cruiser', 'Take the wheel: the Golden Cruiser'],
    ['world-map', 'The map: 28 levels, 5 worlds of LA']
  ];
  function media() {
    return '<div class="md">' +
      '<div class="vid" style="background-image:url(promo/trailer-poster.webp)">' +
        '<video id="obVid" preload="none" playsinline poster="promo/trailer-poster.webp" aria-label="Save Lost Angeles trailer, 30 seconds">' +
          '<source src="promo/trailer.mp4" type="video/mp4"></video>' +
        '<button type="button" class="pl" id="obPlay" aria-label="Play the 30-second trailer"><i></i>Watch the trailer<small>0:30</small></button>' +
      '</div>' +
      '<p class="pitch"><b>You&rsquo;re Golden Boy.</b> The city&rsquo;s run by crooks, clout-chasers and paperwork, so you run it: ' +
        'stomp your way from the Venice boardwalk to Alcatraz, rescue citizens, and hold 20 bosses accountable, from Officer Chalkstick ' +
        'to Mayor Basura and Gov. Newscum. Bring a friend for 2-player co-op on one screen. <span>All parody.</span></p>' +
      '<ul class="sh" aria-label="Screenshots">' + SHOTS.map(function (s) {
        return '<li><img data-src="promo/' + s[0] + '.webp" width="960" height="540" loading="lazy" decoding="async" alt="' + s[1] + '"><span>' + s[1] + '</span></li>';
      }).join('') + '</ul>' +
      '<a class="bty" href="/bounty/"><b>$100 BOUNTY</b>First to beat NATIVE in one run wins $100. <em>Opens soon &rarr;</em></a>' +
      '<a class="more" href="/">&#9666; More games at Outpost Boyz (free ones too)</a>' +
    '</div>';
  }
  function sell(cardHtml) {
    gate.className = 'sell';
    gate.innerHTML = '<div class="w"><div class="c">' + cardHtml + '</div>' + media() + '</div>';
    gate.style.display = 'block';
    gate.scrollTop = 0;
    // Screenshots: each one is fetched when it nears the screen (plus the next one, so a swipe doesn't pop in).
    // loading=lazy alone pulls the whole strip in on a phone; this keeps a bounce from Instagram to ~2 images.
    var imgs = [].slice.call(gate.querySelectorAll('.sh img[data-src]'));
    var load = function (i) { if (i && i.getAttribute('data-src')) { i.src = i.getAttribute('data-src'); i.removeAttribute('data-src'); } };
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          var k = imgs.indexOf(e.target); load(imgs[k]); load(imgs[k + 1]); io.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px 150px 0px' });
      imgs.forEach(function (i) { io.observe(i); });
    } else imgs.forEach(load);
    var v = document.getElementById('obVid'), pl = document.getElementById('obPlay');
    pl.addEventListener('click', function () {
      pl.parentNode.removeChild(pl);
      v.controls = true;
      try { var p = v.play(); if (p && p.catch) p.catch(function () { }); } catch (e) { }
    });
  }

  function busy(text) { card(TOP + '<div class="spin"></div><p class="m">' + esc(text) + '</p>'); }
  function signinCard() {
    sell(TOP + '<div class="p">' + PRICE + '</div>' +
      '<a class="b" href="/account/?return=' + encodeURIComponent(HERE) + '">GET IT &mdash; ' + PRICE + '</a>' + LEGAL +
      '<p class="s">Make a free Outpost Boyz account, then it&rsquo;s yours for ' + PRICE + '. ' +
      'Already own it? <a href="/account/?return=' + encodeURIComponent(HERE) + '">Sign in</a> and it opens.</p>');
  }
  function buyCard(who) {
    sell(TOP + '<div class="p">' + PRICE + '</div>' +
      '<button type="button" class="b" id="obBuy">BUY &mdash; ' + PRICE + '</button>' + LEGAL +
      (who ? '<p class="s">Signed in as <b>' + esc(who) + '</b>. <a href="/account/">Not you?</a></p>' : ''));
    document.getElementById('obBuy').addEventListener('click', function () {
      this.disabled = true; this.textContent = 'OPENING CHECKOUT…';
      var b = this;
      Promise.resolve(OB.buy(SLUG)).then(function () {
        setTimeout(function () { b.disabled = false; b.innerHTML = 'BUY &mdash; ' + PRICE; }, 4000);
      });
    });
  }
  function pendingCard() {
    card(TOP + '<p class="m">Payment received &mdash; we&rsquo;re still confirming it with the bank. This usually takes under a minute.</p>' +
      '<button type="button" class="b" id="obAgain">CHECK AGAIN</button>' +
      '<p class="s">Still stuck after a few minutes? Email <a href="mailto:squad@outpostboyz.com" style="color:#9aa89b">squad@outpostboyz.com</a> &mdash; you won&rsquo;t be charged twice.</p>');
    document.getElementById('obAgain').addEventListener('click', function () { check(0); });
  }
  function errCard(text) {
    card(TOP + '<p class="m">' + esc(text) + '</p><button type="button" class="b" id="obRetry">TRY AGAIN</button>' +
      '<a class="b2" href="/">Back to Outpost Boyz</a>');
    document.getElementById('obRetry').addEventListener('click', function () { location.reload(); });
  }

  function wireHome() {
    var MENUS = { title: 1, gameover: 1, credits: 1 };   // not map/results: their headers sit top-left
    var el = document.getElementById('obHome');
    function show(name) { el.style.display = MENUS[name] ? 'flex' : 'none'; }
    if (window.LA && LA.on) { LA.on('scene', show); if (LA.scenes) show(LA.scenes.curName); }
  }

  // ---- this player's copy of the bundle, kept in IndexedDB under get-game's version id (the stored file's
  // content hash). Only an entitled account ever gets the bytes; a matching version skips the ~4MB download.
  // Not Cache Storage: the service worker wipes every cache but its own on update. Every step is best effort.
  var IDB = 'ob-paid-games', STORE = 'bundles';
  function idb(mode, fn) {
    return new Promise(function (res) {
      var done = false, t = setTimeout(function () { finish(null); }, 2500);   // some webviews never answer
      function finish(v) { if (!done) { done = true; clearTimeout(t); res(v); } }
      try {
        var rq = indexedDB.open(IDB, 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore(STORE); };
        rq.onerror = rq.onblocked = function () { finish(null); };
        rq.onsuccess = function () {
          try {
            var db = rq.result, tx = db.transaction(STORE, mode), q = fn(tx.objectStore(STORE));
            tx.oncomplete = function () { finish(q && q.result !== undefined ? q.result : null); db.close(); };
            tx.onerror = tx.onabort = function () { finish(null); db.close(); };
          } catch (e) { finish(null); }
        };
      } catch (e) { finish(null); }
    });
  }
  function cacheGet() { return idb('readonly', function (s) { return s.get(SLUG); }); }
  function cachePut(v, code) { return idb('readwrite', function (s) { s.put({ v: v, code: code, at: Date.now() }, SLUG); }); }
  function cacheDrop() { return idb('readwrite', function (s) { s.delete(SLUG); }); }

  function download(url, version) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('bundle ' + r.status);
      // If Storage exposes the file's ETag and it disagrees (bundle re-published mid-request), don't cache it.
      var et = (r.headers.get('etag') || '').replace(/[^0-9a-f]/gi, '');
      if (et && version && version.indexOf(et) !== 0) version = '';
      return r.text().then(function (code) {
        if (version) cachePut(version, code);
        return code;
      });
    });
  }

  function boot(url, version) {
    if (booted) return;
    busy('Loading the city…');
    var fromCache = false;
    (version ? cacheGet() : Promise.resolve(null)).then(function (c) {
      if (c && c.v === version && typeof c.code === 'string' && c.code.length > 1000) { fromCache = true; return c.code; }
      return download(url, version);
    }).then(function (code) {
      var src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () {
        booted = true;
        URL.revokeObjectURL(src);
        gate.style.display = 'none'; gate.innerHTML = ''; gate.className = '';
        document.body.classList.add('ob-playing');
        var bar = document.getElementById('obInApp'); if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
        document.body.style.paddingBottom = '';
        wireHome();
        if (purchased) { try { history.replaceState(null, '', location.pathname); } catch (e) { } }
        try { OB.trackPlay(SLUG); } catch (e) { }
      };
      s.onerror = function () {
        if (fromCache) { cacheDrop().then(function () { location.reload(); }); return; }
        errCard('The game didn’t start. Refresh to try again.');
      };
      document.body.appendChild(s);
    }).catch(function () {
      errCard('Couldn’t download the game. Check your connection and try again.');
    });
  }

  var who = '';
  async function check(tries) {
    var a = await OB.gameAccess(SLUG);
    if (a.status === 'ok') return boot(a.url, a.version || '');
    if (a.status === 'signin') { cacheDrop(); return signinCard(); }
    if (a.status === 'not_owned') {
      cacheDrop();   // refunded / revoked / different account: don't keep the code around
      if (purchased && tries < 8) {   // the Stripe webhook can lag a few seconds behind the redirect
        busy('Confirming your purchase…');
        setTimeout(function () { check(tries + 1); }, 2500);
        return;
      }
      return purchased ? pendingCard() : buyCard(who);
    }
    errCard(a.message || 'Couldn’t reach the game server. Try again in a minute.');
  }

  async function run() {
    if (!window.OB) { errCard('Sign-in didn’t load (a network hiccup or a blocker). Refresh in a minute.'); return; }
    busy(purchased ? 'Confirming your purchase…' : 'Checking your library…');
    var s = await OB.session();
    if (!s) { cacheDrop(); return signinCard(); }
    who = (s.user && s.user.email) || '';
    try { var p = await OB.profile(); if (p && p.gamertag) who = p.gamertag; } catch (e) { }
    return check(0);
  }
  window.OBGate = { run: run };   // re-run hook (sign-in state changes, tests)
  run();
})();
</script>
