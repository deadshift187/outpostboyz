<!-- ===== OUTPOST BOYZ (site only): paywall gate + home link on menu screens + play counter =====
     The game code is NOT on this page. Signed-in owners (bought or comped) get a 60-second link to the
     private bundle from the get-game edge function; it is fetched as text and run from a Blob URL. -->
<style>
#obHome{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:50;display:none;align-items:center;
  padding:8px 12px;min-height:28px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:rgba(8,10,16,.72);
  color:#cfd6e4;font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;text-decoration:none}
#obHome:hover,#obHome:focus-visible{color:#fff;border-color:#FF5A1F;outline:none}
#obGate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 50% 30%,#2a1330 0%,#0b0d14 70%);color:#e8e2d4;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:text;user-select:text;overflow:auto}
#obGate .c{width:100%;max-width:420px;text-align:center;border:2px solid #ff4d9d;border-radius:14px;background:rgba(12,10,20,.92);
  padding:18px 18px 16px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#obGate .k{font:800 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;color:#ff4d9d;text-transform:uppercase}
#obGate h1{font:900 clamp(26px,7vw,38px)/.95 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-1px;margin:8px 0 10px;color:#fff}
#obGate .f{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 12px}
#obGate .f span{border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 7px;font:800 10px/1.1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#cfd6e4}
#obGate .p{font:900 30px/1 system-ui,sans-serif;color:#39ff14;margin:4px 0 12px}
#obGate .b{display:block;width:100%;box-sizing:border-box;border:0;border-radius:8px 8px 18px 18px;background:#39ff14;color:#04140a;
  font:900 16px/1 system-ui,sans-serif;letter-spacing:.12em;padding:15px 16px;cursor:pointer;text-decoration:none;text-transform:uppercase}
#obGate .b[disabled]{opacity:.6;cursor:wait}
#obGate .b2{display:inline-block;margin-top:10px;color:#9aa89b;font-size:12px;text-decoration:underline;background:none;border:0;cursor:pointer}
#obGate .m{font-size:14px;line-height:1.45;color:#cfd6e4;margin:6px 0 12px}
#obGate .s{font-size:11px;line-height:1.4;color:#8d93a3;margin:10px 0 0}
#obGate .spin{width:28px;height:28px;margin:14px auto 4px;border:3px solid rgba(255,255,255,.15);border-top-color:#ff4d9d;border-radius:50%;animation:obSpin .8s linear infinite}
@keyframes obSpin{to{transform:rotate(360deg)}}
@media (max-height:420px){#obGate .c{padding:12px 14px}#obGate h1{font-size:26px;margin:4px 0 6px}#obGate .f{margin-bottom:8px}#obGate .p{font-size:24px;margin:2px 0 8px}#obGate .b{padding:12px}}
</style>
<a id="obHome" href="/">&#9666; OUTPOST BOYZ</a>
<div id="obGate" role="dialog" aria-live="polite"><div class="c"><div class="k">Outpost Boyz</div><div class="spin"></div></div></div>
<script>window.OB_NO_AUTOCOUNT = true;   // count a play only when the game actually boots</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="/assets/ob-sdk.js"></script>
<script>
(function () {
  'use strict';
  var SLUG = 'save-lost-angeles', PRICE = '$4.99';
  var HERE = '/games/' + SLUG + '/';
  var gate = document.getElementById('obGate');
  var purchased = /[?&]purchased=1/.test(location.search);
  var booted = false;

  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function card(html) { gate.innerHTML = '<div class="c">' + html + '</div>'; gate.style.display = 'flex'; }
  var TOP = '<div class="k">Outpost Boyz &middot; Undefeated</div><h1>SAVE LOST ANGELES</h1>' +
    '<div class="f"><span>27 levels</span><span>18 bosses</span><span>5 worlds</span><span>2-player co-op</span></div>';
  var FINE = '<p class="s">One-time purchase. Plays on phone and computer. Tied to your account.</p>';

  function busy(text) { card(TOP + '<div class="spin"></div><p class="m">' + esc(text) + '</p>'); }
  function signinCard() {
    card(TOP + '<div class="p">' + PRICE + '</div>' +
      '<a class="b" href="/account/?return=' + encodeURIComponent(HERE) + '">SIGN IN TO PLAY</a>' +
      '<p class="s">Already bought it? Sign in and it opens. New here? Make a free account, then buy it for ' + PRICE + '.</p>');
  }
  function buyCard(who) {
    card(TOP + '<div class="p">' + PRICE + '</div>' +
      '<button type="button" class="b" id="obBuy">BUY &mdash; ' + PRICE + '</button>' + FINE +
      (who ? '<p class="s">Signed in as <b>' + esc(who) + '</b>. <a href="/account/" style="color:#9aa89b">Not you?</a></p>' : ''));
    document.getElementById('obBuy').addEventListener('click', function () {
      this.disabled = true; this.textContent = 'OPENING CHECKOUT…';
      var b = this;
      Promise.resolve(OB.buy(SLUG)).then(function () {
        setTimeout(function () { b.disabled = false; b.innerHTML = 'BUY &mdash; ' + PRICE; }, 4000);
      });
    });
  }
  function pendingCard() {
    card(TOP + '<p class="m">Payment received &mdash; we&rsquo;re still confirming it with the bank. This usually takes under a minute.</p>' +
      '<button type="button" class="b" id="obAgain">CHECK AGAIN</button>' +
      '<p class="s">Still stuck after a few minutes? Email <a href="mailto:squad@outpostboyz.com" style="color:#9aa89b">squad@outpostboyz.com</a> &mdash; you won&rsquo;t be charged twice.</p>');
    document.getElementById('obAgain').addEventListener('click', function () { check(0); });
  }
  function errCard(text) {
    card(TOP + '<p class="m">' + esc(text) + '</p><button type="button" class="b" id="obRetry">TRY AGAIN</button>' +
      '<a class="b2" href="/">Back to Outpost Boyz</a>');
    document.getElementById('obRetry').addEventListener('click', function () { location.reload(); });
  }

  function wireHome() {
    var MENUS = { title: 1, gameover: 1, credits: 1 };   // not map/results: their headers sit top-left
    var el = document.getElementById('obHome');
    function show(name) { el.style.display = MENUS[name] ? 'flex' : 'none'; }
    if (window.LA && LA.on) { LA.on('scene', show); if (LA.scenes) show(LA.scenes.curName); }
  }

  function boot(url) {
    if (booted) return;
    busy('Loading the city…');
    fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('bundle ' + r.status);
      return r.text();
    }).then(function (code) {
      var src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () {
        booted = true;
        URL.revokeObjectURL(src);
        gate.style.display = 'none'; gate.innerHTML = '';
        wireHome();
        if (purchased) { try { history.replaceState(null, '', location.pathname); } catch (e) { } }
        try { OB.trackPlay(SLUG); } catch (e) { }
      };
      s.onerror = function () { errCard('The game didn’t start. Refresh to try again.'); };
      document.body.appendChild(s);
    }).catch(function () {
      errCard('Couldn’t download the game. Check your connection and try again.');
    });
  }

  var who = '';
  async function check(tries) {
    var a = await OB.gameAccess(SLUG);
    if (a.status === 'ok') return boot(a.url);
    if (a.status === 'signin') return signinCard();
    if (a.status === 'not_owned') {
      if (purchased && tries < 8) {   // the Stripe webhook can lag a few seconds behind the redirect
        busy('Confirming your purchase…');
        setTimeout(function () { check(tries + 1); }, 2500);
        return;
      }
      return purchased ? pendingCard() : buyCard(who);
    }
    errCard(a.message || 'Couldn’t reach the game server. Try again in a minute.');
  }

  async function run() {
    if (!window.OB) { errCard('Sign-in didn’t load (a network hiccup or a blocker). Refresh in a minute.'); return; }
    busy(purchased ? 'Confirming your purchase…' : 'Checking your library…');
    var s = await OB.session();
    if (!s) return signinCard();
    who = (s.user && s.user.email) || '';
    try { var p = await OB.profile(); if (p && p.gamertag) who = p.gamertag; } catch (e) { }
    return check(0);
  }
  window.OBGate = { run: run };   // re-run hook (sign-in state changes, tests)
  run();
})();
</script>
