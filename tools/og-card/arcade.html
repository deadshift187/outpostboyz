<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AB';src:url(archivo-black-latin.woff2) format('woff2')}
@font-face{font-family:'IN';src:url(inter-latin-var.woff2) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
.card{position:relative;width:1200px;height:630px;background:#fff;color:#000;overflow:hidden;font-family:'IN',sans-serif;border:14px solid #000}
.k{position:absolute;left:52px;top:44px;font-weight:900;font-size:22px;letter-spacing:6px}
.title{position:absolute;left:46px;top:96px;font-family:'AB';font-size:150px;line-height:.88;letter-spacing:-6px}
.tag{position:absolute;left:52px;top:410px;font-weight:900;font-size:30px;letter-spacing:8px}
.bar{position:absolute;left:0;right:0;bottom:0;height:96px;background:#000;color:#fff;display:flex;align-items:center;padding:0 38px;gap:22px}
.bar b{font-family:'AB';font-size:34px;letter-spacing:-1px}
.bar b i{font-style:normal;color:#ff0000}
.bar span{font-weight:900;font-size:22px;letter-spacing:3px;color:#fff}
.hero{position:absolute;right:40px;top:50px;height:400px;image-rendering:pixelated;filter:drop-shadow(10px 10px 0 #ff0000)}
</style></head>
<body><div class="card">
<div class="k">INDEPENDENT GAME STUDIO</div>
<div class="title">OUTPOST<br>BOYZ</div>
<div class="tag">FREE GAMES IN YOUR BROWSER</div>
<img class="hero" src="goldenJump.webp">
<div class="bar"><b>NEW: SAVE LOST <i>ANGELES</i></b><span>· OUTPOSTBOYZ.COM</span></div>
</div></body></html>
