<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AB';src:url(archivo-black-latin.woff2) format('woff2')}
@font-face{font-family:'IN';src:url(inter-latin-var.woff2) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#000}
.card{position:relative;width:1200px;height:630px;background:#000;color:#fff;overflow:hidden;font-family:'IN',sans-serif}
.sign{position:absolute;right:-60px;top:40px;width:760px;opacity:.22;filter:grayscale(1) contrast(1.2);image-rendering:pixelated}
.top{position:absolute;left:0;top:0;right:0;height:64px;background:#ff0000;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:6px solid #fff}
.top b{font-family:'AB';font-size:34px;letter-spacing:-1px;color:#fff}
.top span{font-weight:900;font-size:20px;letter-spacing:5px;color:#fff}
.title{position:absolute;left:48px;top:112px;font-family:'AB';font-size:124px;line-height:.86;letter-spacing:-5px;text-transform:uppercase}
.title .r{color:#ff0000}
.facts{position:absolute;left:48px;bottom:48px;display:flex;gap:0;border:5px solid #fff}
.facts div{font-weight:900;font-size:24px;letter-spacing:2px;padding:14px 20px;border-right:5px solid #fff;text-transform:uppercase}
.facts div:last-child{border-right:0;background:#fff;color:#000}
.hero{position:absolute;right:48px;bottom:18px;height:430px;image-rendering:pixelated;filter:drop-shadow(10px 10px 0 #ff0000)}
</style></head>
<body><div class="card">
<img class="sign" src="bHollywood.webp">
<div class="top"><b>OUTPOST BOYZ</b><span>COMING SOON</span></div>
<div class="title">SAVE<br>LOST<br><span class="r">ANGELES</span></div>
<img class="hero" src="goldenJump.webp">
<div class="facts"><div>28 levels</div><div>20 bosses</div><div>co-op</div><div>play in browser</div></div>
</div></body></html>
