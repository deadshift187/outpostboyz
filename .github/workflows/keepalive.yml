name: keep-supabase-awake

# Free-tier Supabase pauses after ~7 idle days, which breaks sign-in,
# the leaderboard, play counts, and the signup form. This pings the DB
# every 3 days so it never sleeps. Uses the PUBLIC publishable key
# (same one already shipped in the site), so nothing secret lives here.

on:
  schedule:
    - cron: "0 12 */3 * *"   # every 3 days, noon UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://duogqviqgmbaynfrhrmq.supabase.co/rest/v1/game_plays?select=slug&limit=1" \
            -H "apikey: sb_publishable_2BlS9dXgQdHF04kUtp-b9A_FbfqTzyh")
          echo "Supabase responded: $code"
          if [ "$code" != "200" ]; then echo "Unexpected status"; exit 1; fi
